<!DOCTYPE html>
<html>
<head>
    <title>Self Introduction</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            text-align: center;
        }

        .box {
            width: 70%;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px #bbb;
        }

        h1 { color: #8b0000; }

        .info {
            text-align: left;
            margin: 20px;
        }

        .msg {
            padding: 15px;
            background: #f9eaea;
            border-left: 5px solid #8b0000;
        }

        button {
            margin-top: 20px;
            padding: 10px 25px;
            background: #8b0000;
            color: white;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Welcome to Our Department</h1>

    <h3>Government Polytechnic, Pen</h3>

    <h3>Welcome Back, Admin! 👋</h3>

    <div class="info">
        <p><b>Name:</b> Riya Khariwale</p>
        <p><b>Department:</b> Computer Technology</p>
    </div>

    <div class="msg">
        Hello everyone! I am <b>Riya Khariwale</b>.<br>
        I am a student of the <b>Computer Technology Department</b>.<br><br>
        Welcome to our department! This is my <b>Self Introduction</b>.
    </div>

    <button>Click Me</button>

</div>

</body>
</html>
